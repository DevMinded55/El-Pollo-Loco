<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="style.css" />
        <title>El Pollo Loco</title>
    </head>
    <body>
        <div id="start-screen" class="game-screen game-screen--start">
            <div class="screen-actions screen-actions--bottom">
                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="startGame()"
                >
                    Start Game
                </button>
            </div>
        </div>

        <canvas id="canvas" width="720" height="480"></canvas>

        <div id="end-screen" class="game-screen game-screen--end" hidden>
            <div class="end-screen-inner">
                <img id="end-image" src="" alt="Endscreen" />
                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="restartGame()"
                >
                    Restart Game
                </button>
            </div>
        </div>

<script src="hubs/interval-hub.js"></script>
<script src="hubs/sound-hub.js"></script>
<script src="hubs/image-hub.js"></script>
<script src="models/drawable-object.class.js"></script>
<script src="models/movable-object.class.js"></script>
<script src="models/status-bar.class.js"></script>
<script src="models/coin-bar.class.js"></script>
<script src="models/bottle-bar.class.js"></script>
<script src="models/bossbar.class.js"></script>
<script src="models/world.class.js"></script>
<script src="models/keyboard.class.js"></script>
<script src="models/character.class.js"></script>
<script src="models/chicken.class.js"></script>
<script src="models/chicken-small.class.js"></script>
<script src="models/coins.class.js"></script>
<script src="models/bottles.class.js"></script>
<script src="models/cloud.class.js"></script>
<script src="models/background-object.class.js"></script>
<script src="models/throwable-object.class.js"></script>
<script src="models/endboss.class.js"></script>
<script src="models/level.class.js"></script>

<script src="js/game.js"></script>

    </body>
</html>
